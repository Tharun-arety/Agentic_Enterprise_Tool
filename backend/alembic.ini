[alembic]
script_location = migrations
prepend_sys_path = .

# Deliberately absent: sqlalchemy.url. The connection string lives in
# backend/.env and reaches Alembic through migrations/env.py, which runs it
# through the same normalisation the application uses. Duplicating it here
# would mean a Neon URL that works for the app and fails for migrations.

# Timestamped revision filenames sort chronologically in a directory listing,
# which a bare hash does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
