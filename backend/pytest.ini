[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole session. Both settings are required: the engine
# fixture is session-scoped, and asyncpg connections it opens are bound to the
# loop that created them. Leaving tests on per-function loops makes every
# database test fail with "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Every test here is a plain function. Left at its default, pytest also tries to
# collect any class named Test*, which in this codebase means the ORM's
# `TestProtocol`, `TestSpecLimit` and `TestResult` — domain nouns, not tests.
python_classes =
filterwarnings =
    error::DeprecationWarning:app.*
